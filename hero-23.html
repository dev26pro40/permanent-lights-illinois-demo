<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Permanent Christmas Lights, Macomb IL — Hero 23 "The Quote"</title>
<style>
/* Radical clarity: paper, ink, one red button. Nothing clever. */
:root{
  --paper:#fbfaf7;
  --ink:#141414;
  --mut:#5c5c5c;
  --cta:#c8102e;
  --cta-deep:#a50d26;
  --line:#e3e0d8;
}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased}
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.locale{font-size:13px;color:var(--mut)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:48px 20px 40px;max-width:880px;width:100%;margin:0 auto}
h1{font-size:clamp(2.4rem,9.5vw,4.6rem);line-height:1.06;letter-spacing:-.02em;
  font-weight:800;text-wrap:balance;max-width:16ch}
.reply{margin-top:18px;font-size:clamp(1.15rem,4.6vw,1.5rem);color:var(--mut);font-weight:500}
.cta{margin-top:30px;display:flex;align-items:center;justify-content:center;
  min-height:68px;padding:16px 32px;border-radius:10px;background:var(--cta);color:#fff;
  font-weight:800;font-size:clamp(1.15rem,4.8vw,1.4rem);text-decoration:none;
  letter-spacing:.01em}
.cta:hover{background:var(--cta-deep)}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.proof{margin-top:38px;border-top:1px solid var(--line);list-style:none;padding:22px 0 0}
.proof li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;
  font-size:clamp(1rem,4vw,1.12rem);font-weight:550}
.proof li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;
  background:var(--cta);margin-top:.5em}
.foot{padding:16px 20px 22px;text-align:center;font-size:12.5px;color:var(--mut);
  border-top:1px solid var(--line)}
@media (min-width:900px){
  .topbar{padding:18px 36px}
  main{padding:64px 36px}
  .cta{max-width:520px}
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="brand" href="https://dev26pro40.github.io/permanent-lights-illinois-demo/">Permanent Lights Illinois</a>
    <span class="locale">Macomb, Illinois</span>
  </div>
  <main>
    <h1>Permanent Christmas lights in Macomb, Illinois.</h1>
    <p class="reply">Free quote within 24 hours.</p>
    <a class="cta" href="https://dev26pro40.github.io/permanent-lights-illinois-demo/index.html#quote">Get my free quote</a>
    <ul class="proof">
      <li>IronPeak dealer</li>
      <li>5-year product warranty</li>
      <li>The person who measures your roofline installs it</li>
    </ul>
  </main>
  <p class="foot">Hero concept 23 of 10 — "The Quote" — demo only.</p>
</div>
</body>
</html>
