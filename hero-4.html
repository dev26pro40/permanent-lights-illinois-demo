<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero concept 4 — Permanent Lights Illinois</title>
<meta name="theme-color" content="#070b16">
<meta name="description" content="Hero concept 4 of 5: the night photo leads, treated frame, sheen headline. Demo only.">
<!-- HERO-4 -->
<style>
  :root{
    --bg:#070b16; --bg2:#0b1120; --card:#101828;
    --ink:#f2f5fa; --muted:#9aa6bb; --faint:#8b9bb5; --line:#1e2a44;
    --amber:#f2b23e; --amber-d:#c98f22;
  }
  @property --fa{syntax:"<angle>";initial-value:0deg;inherits:false}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  .skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--amber);
    color:#1a1206;font-weight:700;padding:10px 16px;border-radius:10px;
    text-decoration:none;transition:top .15s}
  .skip:focus{top:12px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .nav{position:sticky;top:0;z-index:50;background:rgba(7,11,22,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;
    padding-top:12px;padding-bottom:12px}
  .brand{display:inline-flex;align-items:center;background:#ffffff;border-radius:10px;
    padding:5px 7px;line-height:0;text-decoration:none}
  .brand img{width:38px;height:auto;display:block}
  .btn{display:inline-block;background:var(--amber);color:#1a1206;font-weight:700;
    padding:14px 28px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;
    font-size:16px;transition:transform .15s ease,background .15s ease}
  .btn:hover{background:var(--amber-d)}
  .btn:active{transform:scale(.98)}
  .btn-nav{padding:10px 18px;font-size:15px}

  /* hero 4 — the photo is the pitch */
  .hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;
    overflow:hidden}
  .hero .photo{position:absolute;inset:0;z-index:0}
  .hero .photo img{width:100%;height:100%;object-fit:cover;
    animation:kenburns 28s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
  .hero .scrim{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(7,11,22,.62) 0%,rgba(7,11,22,.05) 35%,rgba(7,11,22,.82) 100%),
      linear-gradient(100deg,rgba(7,11,22,.55) 0%,transparent 60%)}
  .hero .frame{position:absolute;inset:16px;z-index:2;pointer-events:none;border-radius:20px}
  .hero .frame::before{content:"";position:absolute;inset:0;border-radius:20px;padding:2px;
    background:conic-gradient(from var(--fa),
      transparent 0deg, transparent 250deg,
      rgba(242,178,62,.95) 290deg, rgba(255,240,200,.9) 305deg,
      transparent 340deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:framespin 10s linear infinite}
  @keyframes framespin{to{--fa:360deg}}
  .hero-inner{position:relative;z-index:3;padding:120px 20px 72px;max-width:1120px;
    margin:0 auto;width:100%}
  .kicker{font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--amber);margin-bottom:16px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  h1{font-size:clamp(42px,7.5vw,88px);line-height:1.03;letter-spacing:-1.5px;
    font-weight:800;text-wrap:balance;max-width:15ch;margin-bottom:18px;
    text-shadow:0 3px 24px rgba(0,0,0,.75)}
  h1 .sheen{
    background:linear-gradient(110deg,#f2f5fa 42%,#ffe6ae 50%,#f2f5fa 58%);
    background-size:230% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sheen 6s ease-in-out infinite}
  @keyframes sheen{0%{background-position:130% 0}55%,100%{background-position:-130% 0}}
  .sub{font-size:clamp(16px,2.2vw,20px);color:#dfe6f2;max-width:560px;margin-bottom:30px;
    text-shadow:0 2px 14px rgba(0,0,0,.8)}
  .cta-row{display:flex;gap:14px;flex-wrap:wrap}
  .sample-tag{margin-top:26px;font-size:12.5px;color:var(--faint);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    display:inline-block;background:rgba(7,11,22,.55)}

  footer{border-top:1px solid var(--line);padding:28px 0;background:var(--bg)}
  .concept-note{color:var(--faint);font-size:13px;text-align:center}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    h1 .sheen{color:var(--ink);background:none;-webkit-background-clip:border-box;background-clip:border-box}
  }
</style>
</head>
<body>
<a class="skip" href="#hero">Skip to content</a>
<nav class="nav" aria-label="Site">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Premier Duo LLC — back to main demo">
      <img src="assets/premier-duo-monogram.svg" alt="Premier Duo LLC logo" width="38" height="34">
    </a>
    <a class="btn btn-nav" href="index.html#quote">Get my free quote</a>
  </div>
</nav>

<main>
  <section class="hero" id="hero">
    <div class="photo" aria-hidden="true">
      <img src="https://ironpeaklighting.com/cdn/shop/t/53/assets/ip-hq-house-lit.jpg"
           alt="" fetchpriority="high" width="1600" height="1149">
    </div>
    <div class="scrim" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="kicker">Macomb, IL and 60 miles in every direction</p>
      <h1>Your Christmas lights, <span class="sheen">up all year.</span></h1>
      <p class="sub">One install for Christmas, Halloween, game day, the 4th, birthdays. Or just a warm white glow every evening.</p>
      <div class="cta-row">
        <a class="btn" href="index.html#quote">Get my free quote</a>
      </div>
      <p><span class="sample-tag">Sample install shown</span></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="concept-note">Hero concept 4 of 5 — demo only.</p>
  </div>
</footer>
</body>
</html>
