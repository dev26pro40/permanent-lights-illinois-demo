<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Permanent lights, tucked under your soffit — Hero 20 "One line of light"</title>
<style>
:root{
  --gallery:#fdfcf9; --ink:#171310; --mut:#6d6357; --line:rgba(23,19,16,.14);
  --glow:#ffd98f; --radius:10px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--gallery);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.brand img{width:32px;height:32px;border-radius:8px;background:#fff;padding:2px;border:1px solid var(--line)}
.nav-cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:10px 20px;border-radius:999px;background:var(--ink);color:var(--gallery);font-weight:700;font-size:15px;text-decoration:none}
.hero{padding:48px 0 56px;text-align:center}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:20px}
/* the one line of light */
.lightline{height:3px;width:100%;max-width:560px;margin:0 auto;background:var(--glow);border-radius:3px;box-shadow:0 0 22px 4px rgba(255,200,110,.75),0 0 60px 10px rgba(255,190,100,.35)}
h1{margin-top:30px;font-size:clamp(1.9rem,7.4vw,3.1rem);line-height:1.18;letter-spacing:-.015em;font-weight:600;text-wrap:balance;max-width:20ch;margin-left:auto;margin-right:auto}
h1 .l{display:block}
.sub{margin:18px auto 0;font-size:clamp(1rem,3.8vw,1.15rem);color:var(--mut);max-width:38ch}
/* small product crop */
.crop{margin:34px auto 0;max-width:300px}
.crop figure{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.crop img{width:100%;aspect-ratio:4/3;object-fit:cover}
.crop figcaption{padding:10px 12px;font-size:13px;color:var(--mut);text-align:left}
.crop figcaption .badge{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.cta{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:13px 36px;border-radius:999px;background:var(--ink);color:var(--gallery);font-weight:700;font-size:17px;text-decoration:none;margin-top:30px}
.foot{border-top:1px solid var(--line);margin-top:44px;padding:16px 0 22px;text-align:center;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Primary">
    <a class="brand" href="https://dev26pro40.github.io/permanent-lights-illinois-demo/">
      <img src="assets/premier-duo-monogram.svg" alt="" width="32" height="32">Permanent Lights Illinois</a>
    <a class="nav-cta" href="https://dev26pro40.github.io/permanent-lights-illinois-demo/index.html#quote">Get a free quote</a>
  </nav>
  <header class="hero">
    <p class="kicker">Permanent exterior lighting · Macomb, Illinois</p>
    <div class="lightline" aria-hidden="true"></div>
    <h1>
      <span class="l">Permanent lights.</span>
      <span class="l">Tucked under your soffit.</span>
      <span class="l">Controlled by your phone.</span>
    </h1>
    <p class="sub">One install. Warm white every night, color for the seasons. Invisible by day.</p>
    <div class="crop">
      <figure>
        <img src="assets/fresh/fp2.jpg" alt="Close-up of the soffit-mounted light track, sample install" fetchpriority="high">
        <figcaption><span class="badge">Sample install</span><br>The track sits under the soffit. You see the light, not the hardware.</figcaption>
      </figure>
    </div>
    <a class="cta" href="https://dev26pro40.github.io/permanent-lights-illinois-demo/index.html#quote">Get a free quote</a>
  </header>
  <footer class="foot">Hero concept 20 of 10 — demo only</footer>
</div>
</body>
</html>
