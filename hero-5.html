<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero concept 5 — Permanent Lights Illinois</title>
<meta name="theme-color" content="#070b16">
<meta name="description" content="Hero concept 5 of 5: minimal typographic, shuffle-in headline. Demo only.">
<!-- HERO-5 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  :root{
    --bg:#05070d; --bg2:#0b1120; --card:#101828;
    --ink:#f2f5fa; --muted:#9aa6bb; --faint:#8b9bb5; --line:#1e2a44;
    --amber:#f2b23e; --amber-d:#c98f22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;color-scheme:dark}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  .skip{position:absolute;left:12px;top:-60px;z-index:200;background:var(--amber);
    color:#1a1206;font-weight:700;padding:10px 16px;border-radius:10px;
    text-decoration:none;transition:top .15s}
  .skip:focus{top:12px}
  a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  .nav{position:sticky;top:0;z-index:50;background:rgba(5,7,13,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;
    padding-top:12px;padding-bottom:12px}
  .brand{display:inline-flex;align-items:center;background:#ffffff;border-radius:10px;
    padding:5px 7px;line-height:0;text-decoration:none}
  .brand img{width:38px;height:auto;display:block}
  .btn{display:inline-block;background:var(--amber);color:#1a1206;font-weight:700;
    padding:14px 28px;border-radius:12px;text-decoration:none;border:0;cursor:pointer;
    font-size:16px;transition:transform .15s ease,background .15s ease}
  .btn:hover{background:var(--amber-d)}
  .btn:active{transform:scale(.98)}
  .btn-nav{padding:10px 18px;font-size:15px}

  /* hero 5 — midnight type */
  .hero{position:relative;min-height:100svh;display:flex;align-items:center;
    justify-content:center;overflow:hidden;text-align:center}
  .hero .glowdot{position:absolute;top:-140px;left:50%;transform:translateX(-50%);
    width:520px;height:340px;z-index:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(242,178,62,.13),transparent 70%)}
  .hero .rule{width:44px;height:2px;background:var(--amber);margin:0 auto 30px;opacity:.85}
  .hero-inner{position:relative;z-index:1;padding:110px 20px 90px;max-width:880px}
  .kicker{font-size:12.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
    color:var(--faint);margin-bottom:26px}
  h1{font-size:clamp(44px,8vw,96px);line-height:1.06;letter-spacing:-1px;
    font-weight:700;text-wrap:balance;margin-bottom:26px;min-height:2.2em}
  h1 .sc{display:inline-block;min-width:.5ch;will-change:contents}
  h1 .sw{display:inline-block;white-space:nowrap}
  .sub{font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:560px;
    margin:0 auto 38px}
  .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .fine{margin-top:34px;font-size:13px;color:var(--faint)}

  footer{border-top:1px solid var(--line);padding:28px 0;background:var(--bg)}
  .concept-note{color:var(--faint);font-size:13px;text-align:center}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<a class="skip" href="#hero">Skip to content</a>
<nav class="nav" aria-label="Site">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Premier Duo LLC — back to main demo">
      <img src="assets/premier-duo-monogram.svg" alt="Premier Duo LLC logo" width="38" height="34">
    </a>
    <a class="btn btn-nav" href="index.html#quote">Get my free quote</a>
  </div>
</nav>

<main>
  <section class="hero" id="hero">
    <div class="glowdot" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="rule" aria-hidden="true"></div>
      <p class="kicker">Macomb, Illinois</p>
      <h1 id="h1">Your Christmas lights, up all year.</h1>
      <p class="sub">One install. Every holiday, game day, and quiet evening in between.</p>
      <div class="cta-row">
        <a class="btn" href="index.html#quote">Get my free quote</a>
      </div>
      <p class="fine">Free quote. No ladder on your end.</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="concept-note">Hero concept 5 of 5 — demo only.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var h1 = document.getElementById("h1");

  /* Shuffle: letters slot-machine into place, then settle (React Bits, vanilla port) */
  if(!h1 || typeof gsap === "undefined" || reduceMotion){ return; }
  var GLYPHS = "!<>-_\\/[]{}=+*^?#________";
  var text = h1.textContent;
  h1.setAttribute("aria-label", text);
  h1.textContent = "";
  var spans = [];
  text.split(/(\s+)/).forEach(function(part){
    if(/^\s+$/.test(part)){
      h1.appendChild(document.createTextNode("\u00A0"));
      return;
    }
    var w = document.createElement("span");
    w.className = "sw";
    w.setAttribute("aria-hidden", "true");
    part.split("").forEach(function(c){
      var s = document.createElement("span");
      s.className = "sc";
      s.textContent = c;
      w.appendChild(s);
      spans.push({el:s, final:c, done:false});
    });
    h1.appendChild(w);
  });

  var startDelay = 0.35, settleEach = 0.028, scrambleTicks = 7;
  spans.forEach(function(sp, i){
    var el = sp.el;
    var beginAt = startDelay + i * settleEach;
    var tick = 0;
    gsap.delayedCall(beginAt, function(){
      var iv = setInterval(function(){
        tick++;
        if(tick >= scrambleTicks){
          clearInterval(iv);
          el.textContent = sp.final;
          sp.done = true;
          return;
        }
        el.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      }, 55);
    });
    gsap.from(el, {opacity:0, duration:0.3, delay:beginAt});
  });
})();
</script>
</body>
</html>
